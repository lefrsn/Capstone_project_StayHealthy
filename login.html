<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Stay Healthy</title>
    <link rel="icon" type="image/png" href="images/doctor_favicon.png">
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700,300italic,400italic,700italic" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                Stay Healthy
                <img src="images/doctor_favicon.png" alt="Logo" class="navbar-logo">
            </a>
            <div class="navbar-menu">
                <ul class="navbar-nav">
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="index.html" class="nav-link">Appointments</a></li>
                    <li><a href="index.html" class="nav-link">Health Blog</a></li>
                    <li><a href="index.html" class="nav-link">Reviews</a></li>
                </ul>
                <div class="navbar-buttons">
                    <a href="signup.html" class="btn btn-primary">Sign Up</a>
                    <a href="login.html" class="btn btn-primary">Log In</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Log In Form Section -->
    <section class="login-page-section">
        <div class="container">
            <div class="login-form-wrapper login-page-wrapper">
                <a href="index.html" class="back-link"><i class="bi bi-arrow-left"></i> Back to Home</a>
                <h2>Log In</h2>
                <p class="new-member">Are you a new member? <a href="signup.html" class="signup-link">Sign Up</a></p>
                
                <form class="login-form" id="loginForm">
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" name="email" class="form-control" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group password-group">
                        <label for="login-password">Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="login-password" name="password" class="form-control" placeholder="Enter your password" required>
                            <button type="button" class="toggle-password" id="toggleLoginPassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-buttons">
                        <button type="submit" class="btn btn-primary btn-submit">Log In</button>
                        <button type="reset" class="btn btn-secondary btn-reset">Reset</button>
                    </div>

                    <div class="forgot-password">
                        <a href="#!" class="forgot-password-link">Forgot password?</a>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        
    </footer>

    <script src="script.js"></script>
</body>
</html>
