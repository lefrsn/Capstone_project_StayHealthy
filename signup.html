<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Stay Healthy</title>
    <link rel="icon" type="image/png" href="images/doctor_favicon.png">
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700,300italic,400italic,700italic" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                Stay Healthy
                <img src="images/doctor_favicon.png" alt="Logo" class="navbar-logo">
            </a>
            <div class="navbar-menu">
                <ul class="navbar-nav">
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="index.html" class="nav-link">Appointments</a></li>
                    <li><a href="index.html" class="nav-link">Health Blog</a></li>
                    <li><a href="index.html" class="nav-link">Reviews</a></li>
                </ul>
                <div class="navbar-buttons">
                    <a href="signup.html" class="btn btn-primary">Sign Up</a>
                    <a href="login.html" class="btn btn-primary">Log In</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Sign Up Form Section -->
    <section class="signup-page-section">
        <div class="container">
            <div class="signup-form-wrapper signup-page-wrapper">
                <a href="index.html" class="back-link"><i class="bi bi-arrow-left"></i> Back to Home</a>
                <h2>Sign Up</h2>
                <p class="already-member">Already a member? <a href="login.html" class="login-link">Log In</a></p>
                
                <form class="signup-form" id="signupForm">
                    <div class="form-group">
                        <label for="role">Role</label>
                        <select id="role" name="role" class="form-control" required>
                            <option value="">Select role</option>
                            <option value="patient">Patient</option>
                            <option value="doctor">Doctor</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" class="form-control" placeholder="Enter name" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="tel" id="phone" name="phone" class="form-control" placeholder="Enter phone number" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="Enter Email" required>
                    </div>

                    <div class="form-group password-group">
                        <label for="password">Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
                            <button type="button" class="toggle-password" id="togglePassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-buttons">
                        <button type="submit" class="btn btn-primary btn-submit">Submit</button>
                        <button type="reset" class="btn btn-secondary btn-reset">Reset</button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        
    </footer>

    <script src="script.js"></script>
</body>
</html>
