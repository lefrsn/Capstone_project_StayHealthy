<!-- Log In Form Section -->
<section class="login-page-section">
    <div class="container">
        <div class="login-form-wrapper login-page-wrapper">
            <a href="index.html" class="back-link"><i class="bi bi-arrow-left"></i> Back to Home</a>
            <h2>Log In</h2>
            <p class="new-member">Are you a new member? <a href="signup.html" class="signup-link">Sign Up</a></p>
            
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" name="email" class="form-control" placeholder="Enter your email" required>
                </div>

                <div class="form-group password-group">
                    <label for="login-password">Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="login-password" name="password" class="form-control" placeholder="Enter your password" required>
                        <button type="button" class="toggle-password" id="toggleLoginPassword">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-buttons">
                    <button type="submit" class="btn btn-primary btn-submit">Log In</button>
                    <button type="reset" class="btn btn-secondary btn-reset">Reset</button>
                </div>

                <div class="forgot-password">
                    <a href="#!" class="forgot-password-link">Forgot password?</a>
                </div>
            </form>
        </div>
    </div>
</section>
